name: Build Telegram Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # 1. دریافت سورس بدون ساب‌ماژول
      - name: Checkout My Telegram Source
        uses: actions/checkout@v4
        with:
          repository: amirhosinhosinix-jpg/Nava-Android
          ref: master
          submodules: false          # ← تغییر اصلی: غیرفعال کردن clone بازگشتی
          fetch-depth: 1

      # 2. دریافت کم‌عمق ساب‌ماژول‌ها (سریع‌تر)
      - name: Init and update submodules (shallow)
        run: |
          git submodule init
          git submodule update --depth=1 --recursive --jobs=4

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v4

      # 5. آزادسازی فضا
      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean
          echo "=== AFTER CLEANUP ==="
          df -h

      # 6. بررسی سورس
      - name: Verify Telegram Source
        run: |
          set -e
          echo "=== VERIFYING TELEGRAM SOURCE ==="
          git remote -v
          git rev-parse HEAD
          git branch --show-current
          test -f gradlew || { echo "ERROR: gradlew not found!"; exit 1; }
          test -f settings.gradle || { echo "ERROR: settings.gradle not found!"; exit 1; }
          if [ -f "TMessagesProj_Modules/media/core_settings.gradle" ]; then
            echo "Found: TMessagesProj_Modules/media/core_settings.gradle"
          elif [ -f "TMessagesProj/jni/core_settings.gradle" ]; then
            echo "Found: TMessagesProj/jni/core_settings.gradle"
          else
            echo "WARNING: core_settings.gradle not found, continuing..."
          fi
          echo "=== SOURCE CHECK PASSED ==="

      # 7. نصب Android SDK و NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 8. بررسی فضا
      - name: Check disk after NDK
        run: |
          df -h
          du -sh "$ANDROID_HOME" 2>/dev/null || true
          du -sh "$ANDROID_HOME/ndk/27.2.12479018" 2>/dev/null || true

      # 9. فقط ARM64
      - name: Keep only arm64-v8a
        run: |
          grep -rlE "abiFilters|armeabi-v7a" \
            --include='build.gradle' \
            --include='*.gradle' \
            . 2>/dev/null |
          while read -r f; do
            echo "Patching: $f"
            sed -i -E '/abiFilters/ s/abiFilters.*/abiFilters "arm64-v8a"/' "$f" || true
            sed -i -E '/include +"armeabi-v7a"/ s/include.*/include "arm64-v8a"/' "$f" || true
          done

      # 10. تنظیمات Gradle
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          EOF

      # 11. ccache
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # 12. Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # 13. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 14. فضای قبل از Build
      - name: Check disk before build
        run: |
          df -h
          du -sh ~/.gradle 2>/dev/null || true
          du -sh ~/.ccache 2>/dev/null || true

      # 15. مجوز اجرا
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 16. بیلد
      - name: Build Telegram Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2
        env:
          CC: ccache clang
          CXX: ccache clang++

      # 17. پیدا کردن APK
      - name: Find APK
        if: success()
        run: find . -type f -name "*.apk" -exec ls -lh {} \;

      # 18. آپلود APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # 19. فضای نهایی
      - name: Final disk usage
        if: always()
        run: df -h
